# nginx 同时干两件事：
# 1. 静态文件服务（Vue 构建产物）
# 2. 反向代理 /api → backend:8080（docker 内网域名，替代开发期的 vite 代理）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 history 模式：刷新 /articles 等路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：剥掉 /api 前缀后转发——和 vite 代理 rewrite 行为一致
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
